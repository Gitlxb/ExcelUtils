server.port=${SERVER_PORT:8080}

# ========== 文件上传 ==========
file.upload-dir=${user.dir}/uploads
# 「合并个税」按目录整批上传：实测 48 个源簿约 17.3 MB，原 50MB 上限余量仅约 2.9 倍，
# 单簿变大或批次合并即触顶（报 413 / MaxUploadSizeExceededException），故上调。
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=300MB
# 文件全存内存（避开 Windows Temp 目录的清理问题）；阈值需 ≥ max-file-size，否则大文件会落盘
spring.servlet.multipart.file-size-threshold=300MB
# 【关键】单次 multipart 请求允许的分片数，Tomcat 默认仅 50。
# 一次按目录上传 49~51 个源簿 + 规则表必然超过，Tomcat 抛 IllegalStateException，
# 又会被 Spring 包装成 MaxUploadSizeExceededException，前端显示
# 「Maximum upload size exceeded」——与文件体积无关，极易误判。
server.tomcat.max-part-count=2000

# ========== DeepSeek API  ==========
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.api.model=deepseek-chat
